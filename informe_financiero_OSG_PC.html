<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe Financiero OSG 2025 · Área 3, Región C</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:     #1a2456;
  --navy-mid: #2a3870;
  --navy-lt:  #3a4e9a;
  --gold:     #c9a84c;
  --gold-lt:  #e8c96d;
  --white:    #f8f7f4;
  --cream:    #f0ede6;
  --text:     #1a1a2e;
  --muted:    #6b7280;
  --accent:   #e63946;
  --green:    #2d6a4f;
  --green-lt: #edf7ed;
  --orange:   #e07a28;
  --orange-lt:#fff8f0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; font-family: 'Source Sans 3', sans-serif; background: #080e22; color: var(--white); user-select: none; }

/* ══ TOP BAR ══ */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 52px;
  background: var(--navy); border-bottom: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; z-index: 300; gap: 20px;
}
#topbar-left { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
#timer-display { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold-lt); letter-spacing: 4px; min-width: 90px; }
#timer-display.warning { color: #ff9f43; }
#timer-display.danger  { color: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.tbtn { padding: 6px 16px; border: 1px solid var(--gold); background: transparent; color: var(--gold); border-radius: 5px; cursor: pointer; font-size: .82rem; font-family: inherit; transition: all .15s; }
.tbtn:hover { background: var(--gold); color: var(--navy); }
#topbar-center { flex: 1; display: flex; align-items: center; justify-content: center; }
#slide-title-bar { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--white); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px; }
#topbar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#slide-counter { font-size: .78rem; color: var(--muted); letter-spacing: 1.5px; white-space: nowrap; }
.nav-btn { padding: 7px 22px; border: 1px solid var(--gold); background: transparent; color: var(--gold); border-radius: 6px; cursor: pointer; font-family: inherit; font-size: .88rem; transition: all .15s; white-space: nowrap; }
.nav-btn:hover { background: rgba(201,168,76,.15); }
.nav-btn:disabled { opacity: .22; pointer-events: none; }
.nav-btn.primary { background: var(--gold); color: var(--navy); font-weight: 700; }
.nav-btn.primary:hover { background: var(--gold-lt); }
#progress-bar { position: fixed; top: 52px; left: 0; height: 3px; background: var(--gold); transition: width .6s linear; z-index: 299; }

/* ══ LAYOUT ══ */
#layout { position: fixed; top: 55px; bottom: 0; left: 0; right: 0; display: flex; }

#sidebar {
  width: 200px; flex-shrink: 0;
  background: #0d1530; border-right: 1px solid rgba(201,168,76,.2);
  overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 2px;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: rgba(201,168,76,.3); border-radius: 2px; }
.side-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; border: none; background: transparent; text-align: left; width: 100%; border-left: 3px solid transparent; transition: all .15s; }
.side-item:hover { background: rgba(255,255,255,.05); }
.side-item.active { background: rgba(201,168,76,.12); border-left-color: var(--gold); }
.side-num { font-family: 'Playfair Display', serif; font-size: .8rem; color: var(--gold); min-width: 20px; flex-shrink: 0; }
.side-label { font-size: .72rem; color: #a0aec0; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.side-item.active .side-label { color: var(--white); }

#stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0a0f24; background-image: radial-gradient(ellipse at 30% 50%, rgba(26,36,86,.6) 0%, transparent 60%); overflow: hidden; }

#slide-frame {
  width: 100%; max-width: 1100px; aspect-ratio: 16/9;
  background: var(--white); color: var(--text);
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(201,168,76,.2);
  display: flex; flex-direction: column; animation: fadeUp .3s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(10px) scale(.99)} to{opacity:1;transform:translateY(0) scale(1)} }

/* ══ SLIDE ANATOMY ══ */
.s-header { background: var(--navy); padding: 20px 36px 16px; flex-shrink: 0; position: relative; }
.s-header::after { content:''; display:block; height:2px; background:linear-gradient(90deg,var(--gold),var(--gold-lt) 40%,transparent); margin-top:12px; }
.s-tag   { font-size:.65rem; letter-spacing:3px; color:var(--gold); text-transform:uppercase; margin-bottom:5px; }
.s-title { font-family:'Playfair Display',serif; font-size:1.65rem; color:var(--white); line-height:1.2; }
.s-sub   { font-size:.82rem; color:#a0aec0; margin-top:4px; }
.s-body  { padding:20px 36px 22px; flex:1; display:flex; flex-direction:column; gap:12px; overflow:hidden; }
.s-body.cols { flex-direction:row; gap:24px; }
.col     { display:flex; flex-direction:column; gap:11px; flex:1; overflow:hidden; }
.col.w38 { flex: 0 0 38%; }
.col.w45 { flex: 0 0 45%; }
.col.w55 { flex: 0 0 55%; }

/* ══ COVER ══ */
.cover-wrap { display:flex; flex-direction:column; height:100%; }
.cover-hero {
  background: linear-gradient(140deg, var(--navy) 0%, var(--navy-mid) 50%, var(--navy-lt) 100%);
  flex:1; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; text-align:center; padding:32px 60px;
  position:relative; overflow:hidden;
}
.cover-hero::before { content:'$'; position:absolute; font-family:'Playfair Display',serif; font-size:20rem; color:rgba(255,255,255,.03); right:-20px; top:-40px; line-height:1; pointer-events:none; }
.cover-hero::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--gold),var(--gold-lt),var(--gold),transparent); }
.cover-badge { display:inline-block; border:1px solid var(--gold); color:var(--gold); font-size:.65rem; letter-spacing:3px; padding:5px 18px; border-radius:20px; }
.cover-hero h1 { font-family:'Playfair Display',serif; font-size:2.6rem; color:var(--white); line-height:1.15; }
.cover-hero .lema { font-size:.95rem; color:var(--gold-lt); font-style:italic; line-height:1.6; max-width:520px; }
.cover-meta { display:grid; grid-template-columns:repeat(4,1fr); background:#ddd; gap:1px; flex-shrink:0; }
.meta-item { background:var(--cream); padding:15px 10px; text-align:center; }
.meta-val  { font-family:'Playfair Display',serif; font-size:1.7rem; color:var(--navy); font-weight:700; line-height:1; }
.meta-val.deficit { color:var(--accent); }
.meta-val.green   { color:var(--green); }
.meta-lbl  { font-size:.65rem; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-top:4px; }

/* ══ COMPONENTS ══ */
.sec-lbl { font-size:.62rem; letter-spacing:3px; color:var(--gold); text-transform:uppercase; padding-bottom:5px; border-bottom:1px solid #e5e7eb; }

.card { background:var(--cream); border-radius:7px; padding:13px 16px; border-left:3px solid var(--navy); }
.card.gold   { border-left-color:var(--gold); }
.card.green  { border-left-color:var(--green); }
.card.red    { border-left-color:var(--accent); }
.card.orange { border-left-color:var(--orange); background:var(--orange-lt); }
.card-lbl { font-size:.62rem; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:4px; }
.card-val { font-family:'Playfair Display',serif; font-size:1.15rem; color:var(--navy); font-weight:700; line-height:1.2; }
.card-val.red   { color:var(--accent); }
.card-val.green { color:var(--green); }
.card-val.gold  { color:#a07820; }
.card-desc { font-size:.8rem; color:var(--text); margin-top:5px; line-height:1.45; }
.card-grid { display:grid; gap:10px; }
.card-grid.g2 { grid-template-columns:1fr 1fr; }
.card-grid.g3 { grid-template-columns:1fr 1fr 1fr; }
.card-grid.g4 { grid-template-columns:1fr 1fr 1fr 1fr; }

/* hbox */
.hbox { border-radius:8px; padding:13px 18px; font-size:.84rem; line-height:1.65; }
.hbox.navy    { background:var(--navy); color:var(--white); }
.hbox.gold-bg { background:var(--gold); color:var(--navy); }
.hbox.cream   { background:var(--cream); color:var(--text); border-left:4px solid var(--gold); }
.hbox.red-bg  { background:#fee2e2; color:#7f1d1d; border-left:4px solid var(--accent); }
.hbox.green-bg{ background:var(--green-lt); color:#1a3a28; border-left:4px solid var(--green); }
.hbox.orange  { background:var(--orange-lt); color:#7a3a10; border-left:4px solid var(--orange); }

/* item list */
.item-list { display:flex; flex-direction:column; }
.item-row  { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid #e5e7eb; }
.item-row:last-child { border-bottom:none; }
.dot   { width:7px; height:7px; border-radius:50%; background:var(--navy); flex-shrink:0; margin-top:5px; }
.dot.g { background:var(--gold); }
.dot.r { background:var(--accent); }
.dot.gr{ background:var(--green); }
.item-text { font-size:.85rem; line-height:1.5; flex:1; }
.badge { font-size:.65rem; padding:2px 8px; border-radius:10px; white-space:nowrap; flex-shrink:0; font-weight:700; }
.ok    { background:#d1fae5; color:#065f46; }
.no    { background:#fee2e2; color:#991b1b; }
.warn  { background:#fef3c7; color:#92400e; }
.top1  { background:#1a2456; color:#e8c96d; }

/* ══ FINANCIAL TABLE ══ */
.fin-table { width:100%; border-collapse:collapse; font-size:.82rem; }
.fin-table th { background:var(--navy); color:var(--gold); padding:9px 14px; text-align:left; font-family:'Playfair Display',serif; }
.fin-table th.r { text-align:right; }
.fin-table td { padding:8px 14px; border-bottom:1px solid #e5e7eb; }
.fin-table td.r { text-align:right; font-family:'Playfair Display',serif; font-size:.88rem; }
.fin-table .sub { background:#f8f7f4; font-weight:700; }
.fin-table .sub td { border-top:2px solid var(--navy); }
.fin-table .pos { color:var(--green); font-weight:700; }
.fin-table .neg { color:var(--accent); font-weight:700; }
.fin-table .deficit-row td { background:#fee2e2; font-weight:700; color:#7f1d1d; font-size:.9rem; border-top:2px solid var(--accent); }
.fin-table .section-head td { background:rgba(26,36,86,.06); font-size:.68rem; letter-spacing:2px; color:var(--muted); text-transform:uppercase; padding:5px 14px; }

/* ══ REGION TABLE ══ */
.reg-table { width:100%; border-collapse:collapse; font-size:.84rem; }
.reg-table th { background:var(--navy); color:var(--gold); padding:9px 14px; text-align:left; font-family:'Playfair Display',serif; }
.reg-table th.r { text-align:right; }
.reg-table td { padding:9px 14px; border-bottom:1px solid #e5e7eb; }
.reg-table td.r { text-align:right; font-family:'Playfair Display',serif; }
.reg-table .highlight-row td { background:rgba(201,168,76,.1); font-weight:700; }
.reg-table .tot td { background:var(--cream); font-weight:700; border-top:2px solid var(--navy); }
.pct-bar { display:inline-block; height:8px; border-radius:4px; background:var(--navy); vertical-align:middle; margin-right:6px; }
.pct-bar.over  { background:var(--green); }
.pct-bar.warn  { background:#ff9f43; }
.pct-bar.low   { background:var(--accent); }

/* ══ BAR CHART ══ */
.bar-chart { display:flex; flex-direction:column; gap:8px; }
.bar-row { display:flex; align-items:center; gap:10px; }
.bar-label { font-size:.78rem; color:var(--text); min-width:110px; flex-shrink:0; text-align:right; }
.bar-track { flex:1; height:22px; background:#e5e7eb; border-radius:4px; overflow:hidden; position:relative; }
.bar-fill  { height:100%; border-radius:4px; transition:width .6s ease; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; }
.bar-fill span { font-size:.7rem; font-weight:700; color:var(--white); white-space:nowrap; }
.bar-val   { font-size:.75rem; color:var(--muted); min-width:90px; flex-shrink:0; font-family:'Playfair Display',serif; }

/* ══ DONUT CHART ══ */
.donut-wrap { display:flex; align-items:center; gap:20px; }
.donut-svg  { flex-shrink:0; }
.donut-legend { display:flex; flex-direction:column; gap:8px; }
.legend-item { display:flex; align-items:center; gap:8px; }
.legend-dot  { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.legend-txt  { font-size:.78rem; color:var(--text); }
.legend-val  { font-size:.75rem; color:var(--muted); margin-left:auto; font-family:'Playfair Display',serif; }

/* ══ CLOSING ══ */
.closing-wrap { display:flex; flex-direction:column; height:100%; }
.closing-hero { background:linear-gradient(140deg,var(--navy) 0%,var(--navy-mid) 50%,var(--navy-lt) 100%); flex:0 0 45%; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; text-align:center; padding:28px 60px; position:relative; overflow:hidden; }
.closing-hero::before { content:'₇'; position:absolute; font-family:'Playfair Display',serif; font-size:18rem; color:rgba(255,255,255,.03); right:-20px; top:-40px; line-height:1; pointer-events:none; }
.closing-body { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:28px; text-align:center; }
.aa-circle { width:80px; height:80px; border-radius:50%; background:var(--navy); border:3px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-size:2rem; color:var(--gold); }
.closing-lema { font-family:'Playfair Display',serif; font-style:italic; font-size:1.25rem; color:var(--navy); line-height:1.45; max-width:560px; }

#kb-hint { position:fixed; bottom:10px; right:16px; font-size:.65rem; color:rgba(255,255,255,.25); letter-spacing:1px; pointer-events:none; }
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-left">
    <div id="timer-display">20:00</div>
    <div style="display:flex;gap:6px">
      <button class="tbtn" id="btnStart">▶ Iniciar</button>
      <button class="tbtn" id="btnPause">⏸ Pausa</button>
      <button class="tbtn" id="btnReset">↺ Reset</button>
    </div>
  </div>
  <div id="topbar-center"><div id="slide-title-bar">Informe Financiero OSG 2025 · Área 3, Región C</div></div>
  <div id="topbar-right">
    <div id="slide-counter">1 / 7</div>
    <button class="nav-btn" id="btnPrev" disabled>← Anterior</button>
    <button class="nav-btn primary" id="btnNext">Siguiente →</button>
  </div>
</div>
<div id="progress-bar" style="width:100%"></div>

<div id="layout">
  <nav id="sidebar"></nav>
  <div id="stage">
    <div id="slide-frame"></div>
  </div>
</div>
<div id="kb-hint">← → Flechas del teclado para navegar</div>

<template id="t-slides">

<!-- ① PORTADA -->
<div class="slide-data" data-label="Portada">
  <div class="cover-wrap">
    <div class="cover-hero">
      <div class="cover-badge">ÁREA 3, REGIÓN C · TERRITORIO SUR · BOGOTÁ · CONFIDENCIAL</div>
      <h1>Informe Financiero OSG 2025</h1>
      <p class="lema">"...fondos suficientes para su funcionamiento, más una reserva adecuada, sean su prudente principio financiero..."<br><em style="font-size:.82rem;color:#a0aec0">— Garantías Generales · Art. 12 Carta Constitutiva</em></p>
    </div>
    <div class="cover-meta">
      <div class="meta-item"><div class="meta-val deficit">-$163,8M</div><div class="meta-lbl">Déficit 2025</div></div>
      <div class="meta-item"><div class="meta-val" style="font-size:1.3rem">$153,4M</div><div class="meta-lbl">Impuesto renta (causa)</div></div>
      <div class="meta-item"><div class="meta-val green">97,5%</div><div class="meta-lbl">Ejecución Región C</div></div>
      <div class="meta-item"><div class="meta-val top1" style="font-size:1.3rem;color:var(--navy)">#1 País</div><div class="meta-lbl">Literatura OSG · Reg. C</div></div>
    </div>
  </div>
</div>

<!-- ② RESUMEN EJECUTIVO -->
<div class="slide-data" data-label="Resumen ejecutivo">
  <div class="s-header">
    <div class="s-tag">Informe Financiero OSG 2025</div>
    <div class="s-title">Resumen Ejecutivo</div>
    <div class="s-sub">62ª RAC · Rionegro, Antioquia · 2026</div>
  </div>
  <div class="s-body cols">
    <div class="col w38">
      <div class="card red">
        <div class="card-lbl">Déficit del ejercicio 2025</div>
        <div class="card-val red" style="font-size:1.6rem">−$163.795.448</div>
        <div class="card-desc">El mayor déficit registrado en la historia reciente de la Corporación</div>
      </div>
      <div class="card orange">
        <div class="card-lbl">Causa principal del déficit</div>
        <div class="card-val" style="font-size:1.1rem;color:var(--orange)">Impuesto de renta</div>
        <div class="card-desc"><strong>$153.369.000</strong> asumido por primera vez. Sin este impuesto, la pérdida operacional habría sido de solo $10.426.448 — manejable, pero igualmente preocupante</div>
      </div>
      <div class="card green">
        <div class="card-lbl">Superávit 2024 (referencia)</div>
        <div class="card-val green">+$29.774.157</div>
        <div class="card-desc">2024 incluyó Convención y Foro Nacional — eventos no realizados en 2025</div>
      </div>
    </div>
    <div class="col">
      <div class="sec-lbl">Contexto del déficit</div>
      <div class="item-list">
        <div class="item-row"><div class="dot r"></div><div class="item-text">El impuesto de renta de $153,4M es una <strong>situación fiscal que la JSG deberá resolver estructuralmente</strong> — no es un gasto recurrente normal</div></div>
        <div class="item-row"><div class="dot r"></div><div class="item-text">En 2024 hubo <strong>Convención Nacional y Foro Nacional</strong> que aportaron $879M en ingresos. En 2025 no se realizaron: eso explica la mayor parte de la caída de ingresos</div></div>
        <div class="item-row"><div class="dot g"></div><div class="item-text">Los ingresos por <strong>literatura crecieron</strong> de $586M a $613M (+4,5%)</div></div>
        <div class="item-row"><div class="dot g"></div><div class="item-text">Los aportes voluntarios crecieron de $328M a <strong>$376M (+14,8%)</strong></div></div>
        <div class="item-row"><div class="dot r"></div><div class="item-text">Los gastos operacionales subieron de $576M a <strong>$711M (+23,3%)</strong> — crecimiento que debe monitorearse</div></div>
      </div>
      <div class="hbox navy" style="margin-top:auto">
        La Séptima Tradición no es una sugerencia: es la <strong>columna vertebral de nuestra independencia</strong>. Cada peso que un grupo aporta es un voto por la autonomía de AA.
      </div>
    </div>
  </div>
</div>

<!-- ③ ESTADO DE RESULTADOS -->
<div class="slide-data" data-label="Estado de resultados">
  <div class="s-header">
    <div class="s-tag">Estado de Resultados 2025 vs. 2024</div>
    <div class="s-title">Ingresos, Gastos y Resultado del Ejercicio</div>
  </div>
  <div class="s-body cols">
    <div class="col">
      <table class="fin-table">
        <thead><tr><th>Concepto</th><th class="r">2025 ($)</th><th class="r">2024 ($)</th></tr></thead>
        <tbody>
          <tr class="section-head"><td colspan="3">INGRESOS OPERACIONALES</td></tr>
          <tr><td>Literatura (misional)</td><td class="r">613.262.600</td><td class="r">586.648.438</td></tr>
          <tr><td>Aportes voluntarios</td><td class="r">376.887.846</td><td class="r">328.276.933</td></tr>
          <tr><td>Boletín y Revista AA El Mensaje</td><td class="r">71.866.750</td><td class="r">64.477.750</td></tr>
          <tr><td>Excedentes de eventos</td><td class="r">108.879.508</td><td class="r">5.575.976</td></tr>
          <tr><td>Convención / Foro Nacional</td><td class="r">—</td><td class="r">879.251.428</td></tr>
          <tr class="sub"><td><strong>TOTAL INGRESOS</strong></td><td class="r"><strong>1.170.896.704</strong></td><td class="r"><strong>1.864.230.525</strong></td></tr>
          <tr class="section-head"><td colspan="3">GASTOS</td></tr>
          <tr><td>Gastos operacionales</td><td class="r">711.141.704</td><td class="r">576.871.655</td></tr>
          <tr><td>Gastos misionales</td><td class="r">525.605.314</td><td class="r">1.261.753.575</td></tr>
          <tr class="sub"><td><strong>PÉRDIDA OPERACIONAL</strong></td><td class="r neg">−65.850.314</td><td class="r pos">+25.605.295</td></tr>

<script>
const MINS = 20;
const slideTitles = [
  'Portada','Resumen ejecutivo','Estado de resultados',
  'Aportes por región','Literatura — Ranking',
  'Mensaje a los grupos','Cierre'
];
const tpl = document.getElementById('t-slides').content;
const slideNodes = Array.from(tpl.querySelectorAll('.slide-data'));
const TOTAL = slideNodes.length;
let current = 1, timeLeft = MINS*60, timerInterval = null, running = false;

const sidebar = document.getElementById('sidebar');
slideNodes.forEach((_,i) => {
  const btn = document.createElement('button');
  btn.className = 'side-item' + (i===0?' active':'');
  btn.innerHTML = `<span class="side-num">${i+1}</span><span class="side-label">${slideTitles[i]}</span>`;
  btn.onclick = () => goTo(i+1);
  sidebar.appendChild(btn);
});

const frame = document.getElementById('slide-frame');
function renderSlide(n) {
  const node = slideNodes[n-1].cloneNode(true);
  frame.innerHTML = '';
  while(node.firstChild) frame.appendChild(node.firstChild);
  frame.style.animation='none'; frame.offsetHeight; frame.style.animation='';
  document.getElementById('slide-title-bar').textContent = slideTitles[n-1];
}
function goTo(n) {
  sidebar.children[current-1].classList.remove('active');
  current = Math.max(1,Math.min(TOTAL,n));
  sidebar.children[current-1].classList.add('active');
  sidebar.children[current-1].scrollIntoView({block:'nearest'});
  renderSlide(current);
  document.getElementById('slide-counter').textContent = current+' / '+TOTAL;
  document.getElementById('btnPrev').disabled = current===1;
  document.getElementById('btnNext').disabled = current===TOTAL;
}
document.getElementById('btnNext').onclick = ()=>goTo(current+1);
document.getElementById('btnPrev').onclick = ()=>goTo(current-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') goTo(current+1);
  if(e.key==='ArrowLeft' ||e.key==='ArrowUp')   goTo(current-1);
});
const display=document.getElementById('timer-display');
const prog=document.getElementById('progress-bar');
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function updateDisplay(){
  display.textContent=fmt(timeLeft);
  prog.style.width=(timeLeft/(MINS*60)*100)+'%';
  display.classList.remove('warning','danger');
  if(timeLeft<=60){display.classList.add('danger');prog.style.background='#e63946';}
  else if(timeLeft<=300){display.classList.add('warning');prog.style.background='#ff9f43';}
  else{prog.style.background='var(--gold)';}
}
function startTimer(){if(running)return;running=true;timerInterval=setInterval(()=>{if(timeLeft>0){timeLeft--;updateDisplay();}else{clearInterval(timerInterval);running=false;}},1000);}
function pauseTimer(){clearInterval(timerInterval);running=false;}
function resetTimer(){pauseTimer();timeLeft=MINS*60;updateDisplay();}
document.getElementById('btnStart').onclick=startTimer;
document.getElementById('btnPause').onclick=pauseTimer;
document.getElementById('btnReset').onclick=resetTimer;
renderSlide(1); updateDisplay();
document.getElementById('slide-counter').textContent='1 / '+TOTAL;
</script>
