<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe 62ª RAC · AA Colombia 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:     #1a2456;
  --navy-mid: #2a3870;
  --navy-lt:  #3a4e9a;
  --gold:     #c9a84c;
  --gold-lt:  #e8c96d;
  --white:    #f8f7f4;
  --cream:    #f0ede6;
  --text:     #1a1a2e;
  --muted:    #6b7280;
  --accent:   #e63946;
  --green:    #2d6a4f;
  --green-lt: #edf7ed;
  --blue-lt:  #e8f4fd;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  font-family: 'Source Sans 3', sans-serif;
  background: #080e22;
  color: var(--white);
  user-select: none;
}

/* ═══════════════════════════════════════
   TOP BAR
═══════════════════════════════════════ */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: var(--navy);
  border-bottom: 2px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 300;
  gap: 20px;
}
#topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
#timer-display {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  color: var(--gold-lt);
  letter-spacing: 4px;
  min-width: 90px;
}
#timer-display.warning { color: #ff9f43; }
#timer-display.danger  { color: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.tbtn {
  padding: 6px 16px;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  border-radius: 5px;
  cursor: pointer;
  font-size: .82rem;
  font-family: inherit;
  transition: all .15s;
  letter-spacing: .5px;
}
.tbtn:hover { background: var(--gold); color: var(--navy); }

#topbar-center {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
}
#slide-title-bar {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  color: var(--white);
  opacity: .85;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 480px;
}
#topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
#slide-counter {
  font-size: .78rem;
  color: var(--muted);
  letter-spacing: 1.5px;
  white-space: nowrap;
}
.nav-btn {
  padding: 7px 22px;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: .88rem;
  transition: all .15s;
  white-space: nowrap;
}
.nav-btn:hover { background: rgba(201,168,76,.15); }
.nav-btn:disabled { opacity: .22; pointer-events: none; }
.nav-btn.primary { background: var(--gold); color: var(--navy); font-weight: 700; }
.nav-btn.primary:hover { background: var(--gold-lt); }

#progress-bar {
  position: fixed;
  top: 52px; left: 0;
  height: 3px;
  background: var(--gold);
  transition: width .6s linear;
  z-index: 299;
}

/* ═══════════════════════════════════════
   LAYOUT: sidebar + stage
═══════════════════════════════════════ */
#layout {
  position: fixed;
  top: 55px; bottom: 0;
  left: 0; right: 0;
  display: flex;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 200px;
  flex-shrink: 0;
  background: #0d1530;
  border-right: 1px solid rgba(201,168,76,.2);
  overflow-y: auto;
  padding: 12px 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb { background: rgba(201,168,76,.3); border-radius: 2px; }

.side-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  border: none;
  background: transparent;
  text-align: left;
  width: 100%;
  border-left: 3px solid transparent;
  transition: all .15s;
}
.side-item:hover { background: rgba(255,255,255,.05); }
.side-item.active {
  background: rgba(201,168,76,.12);
  border-left-color: var(--gold);
}
.side-num {
  font-family: 'Playfair Display', serif;
  font-size: .8rem;
  color: var(--gold);
  min-width: 20px;
  flex-shrink: 0;
}
.side-label {
  font-size: .72rem;
  color: #a0aec0;
  line-height: 1.3;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.side-item.active .side-label { color: var(--white); }

/* ── STAGE ── */
#stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #0a0f24;
  background-image: radial-gradient(ellipse at 30% 50%, rgba(26,36,86,.6) 0%, transparent 60%);
  overflow: hidden;
}

/* ── SLIDE FRAME ── */
#slide-frame {
  width: 100%;
  max-width: 1100px;
  aspect-ratio: 16/9;
  background: var(--white);
  color: var(--text);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(201,168,76,.2);
  position: relative;
  display: flex;
  flex-direction: column;
  animation: fadeUp .3s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px) scale(.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ═══════════════════════════════════════
   SLIDE ANATOMY
═══════════════════════════════════════ */
.s-header {
  background: var(--navy);
  padding: 22px 36px 18px;
  flex-shrink: 0;
  position: relative;
}
.s-header::after {
  content: '';
  display: block;
  height: 2px;
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold-lt) 40%, transparent 100%);
  margin-top: 14px;
}
.s-tag  { font-size: .65rem; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; }
.s-title { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: var(--white); line-height: 1.2; }
.s-sub   { font-size: .82rem; color: #a0aec0; margin-top: 4px; }

.s-body {
  padding: 22px 36px 24px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 13px;
  overflow: hidden;
}

/* two-column body layout */
.s-body.cols {
  flex-direction: row;
  gap: 24px;
}
.col { display: flex; flex-direction: column; gap: 12px; flex: 1; overflow: hidden; }
.col.w40 { flex: 0 0 40%; }
.col.w55 { flex: 0 0 55%; }

/* ═══════════════════════════════════════
   COVER SLIDE
═══════════════════════════════════════ */
.cover-wrap {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.cover-hero {
  background: linear-gradient(140deg, var(--navy) 0%, var(--navy-mid) 50%, var(--navy-lt) 100%);
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
  text-align: center;
  padding: 32px 60px;
  position: relative;
  overflow: hidden;
}
.cover-hero::before {
  content: 'AA';
  position: absolute;
  font-family: 'Playfair Display', serif;
  font-size: 22rem; color: rgba(255,255,255,.03);
  right: -40px; top: -60px; line-height: 1;
  pointer-events: none;
}
.cover-hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--gold-lt), var(--gold), transparent);
}
.cover-badge {
  display: inline-block;
  border: 1px solid var(--gold); color: var(--gold);
  font-size: .65rem; letter-spacing: 3px;
  padding: 5px 18px; border-radius: 20px;
}
.cover-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem; color: var(--white); line-height: 1.15;
}
.cover-lema {
  font-size: 1rem; color: var(--gold-lt);
  font-style: italic; line-height: 1.6;
  max-width: 560px;
}
.cover-meta {
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: #ddd; gap: 1px;
  flex-shrink: 0;
}
.meta-item { background: var(--cream); padding: 16px 10px; text-align: center; }
.meta-val  { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--navy); font-weight: 700; line-height: 1; }
.meta-lbl  { font-size: .65rem; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }

/* ═══════════════════════════════════════
   COMPONENTS
═══════════════════════════════════════ */

/* cards */
.card-grid { display: grid; gap: 10px; }
.card-grid.g2 { grid-template-columns: 1fr 1fr; }
.card-grid.g3 { grid-template-columns: 1fr 1fr 1fr; }
.card-grid.g4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.card {
  background: var(--cream); border-radius: 7px;
  padding: 13px 16px; border-left: 3px solid var(--navy);
}
.card.gold  { border-left-color: var(--gold); }
.card.green { border-left-color: var(--green); }
.card.red   { border-left-color: var(--accent); }
.card.blue  { border-left-color: #1a6fad; }
.card-lbl  { font-size: .62rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.card-val  { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--navy); font-weight: 700; line-height: 1.2; }
.card-desc { font-size: .8rem; color: var(--text); margin-top: 5px; line-height: 1.45; }

/* quorum table */
.q-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.q-table th { background: var(--navy); color: var(--gold); padding: 10px 16px; text-align: left; font-family: 'Playfair Display', serif; font-size: .95rem; }
.q-table td { padding: 9px 16px; border-bottom: 1px solid #e5e7eb; }
.q-table .tot td { font-weight: 700; background: var(--cream); border-top: 2px solid var(--navy); font-size: 1rem; }
.n { text-align: right; font-family: 'Playfair Display', serif; font-size: 1.05rem; }

/* persons */
.person-list { display: flex; flex-direction: column; gap: 8px; }
.person-item { display: flex; align-items: center; gap: 12px; background: var(--cream); border-radius: 7px; padding: 10px 14px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--navy); color: var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: .85rem; font-weight: 700; flex-shrink: 0; }
.person-name { font-weight: 700; color: var(--navy); font-size: .9rem; }
.person-role { font-size: .74rem; color: var(--muted); margin-top: 1px; }

/* item list */
.item-list { display: flex; flex-direction: column; }
.item-row  { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #e5e7eb; }
.item-row:last-child { border-bottom: none; }
.dot   { width: 7px; height: 7px; border-radius: 50%; background: var(--navy); flex-shrink: 0; margin-top: 5px; }
.dot.g { background: var(--gold); }
.item-text { font-size: .85rem; line-height: 1.5; flex: 1; }
.badge { font-size: .65rem; padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; font-weight: 700; }
.ok   { background: #d1fae5; color: #065f46; }
.no   { background: #fee2e2; color: #991b1b; }
.pend { background: #fef3c7; color: #92400e; }

/* hbox */
.hbox { border-radius: 8px; padding: 13px 18px; font-size: .84rem; line-height: 1.65; }
.hbox.navy    { background: var(--navy); color: var(--white); }
.hbox.gold-bg { background: var(--gold); color: var(--navy); }
.hbox.cream   { background: var(--cream); color: var(--text); border-left: 4px solid var(--gold); }
.hbox.warn    { background: #fff8f0; border-left: 4px solid #e07a28; color: var(--text); }
.hbox.warn strong { color: #b85c10; }

/* sec label */
.sec-lbl { font-size: .62rem; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; padding-bottom: 5px; border-bottom: 1px solid #e5e7eb; }

/* timeline */
.timeline { display: flex; flex-direction: column; }
.tl-item  { display: flex; gap: 14px; position: relative; }
.tl-item:not(:last-child)::before { content: ''; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: #e5e7eb; }
.tl-dot   { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); border: 2px solid var(--gold); flex-shrink: 0; display: flex; align-items: center; justify-content: center; z-index: 1; }
.tl-inner { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.tl-content { padding: 3px 0 18px; }
.tl-label { font-size: .62rem; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
.tl-text  { font-size: .84rem; line-height: 1.55; color: var(--text); margin-top: 3px; }

/* ── PLAN UNICIDAD ── */
.plan-hero {
  background: linear-gradient(135deg, #1a3a2a 0%, #2d6a4f 100%);
  border-radius: 8px; padding: 16px 20px; color: var(--white);
  display: flex; align-items: center; gap: 20px;
}
.plan-num-big { font-family: 'Playfair Display', serif; font-size: 3rem; color: #6fcf97; line-height: 1; flex-shrink: 0; }
.plan-hero-text {}
.plan-hero-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; line-height: 1.2; }
.plan-hero-sub   { font-size: .7rem; color: #a7d9b8; letter-spacing: 1.5px; margin-top: 4px; }

.eje-card {
  border-radius: 8px; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 5px; flex: 1;
}
.eje-card.eje-u { background: var(--blue-lt); border-left: 4px solid #1a6fad; }
.eje-card.eje-r { background: var(--green-lt); border-left: 4px solid var(--green); }
.eje-num  { font-size: .6rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
.eje-u .eje-num { color: #1a6fad; }
.eje-r .eje-num { color: var(--green); }
.eje-name { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--navy); }
.eje-desc { font-size: .78rem; color: var(--muted); line-height: 1.45; }

.plan-quote {
  background: var(--navy); color: var(--white);
  border-radius: 8px; padding: 14px 20px;
  font-family: 'Playfair Display', serif; font-style: italic;
  font-size: .95rem; line-height: 1.6; text-align: center;
}
.plan-quote::before { content: '❝'; font-size: 1.4rem; color: var(--gold); display: block; margin-bottom: 3px; font-style: normal; }
.plan-quote cite { display: block; font-size: .6rem; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; margin-top: 8px; font-style: normal; }

.seg-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #e5e7eb; }
.seg-row:last-child { border-bottom: none; }
.seg-icon { font-size: 1rem; flex-shrink: 0; width: 24px; text-align: center; }
.seg-text { font-size: .84rem; line-height: 1.4; flex: 1; }
.seg-freq { font-size: .7rem; color: var(--gold); font-weight: 700; white-space: nowrap; background: rgba(201,168,76,.12); padding: 2px 8px; border-radius: 10px; }

/* ── GRUPOS ACORDEÓN ── */
.grupo-item { background: var(--cream); border-radius: 8px; overflow: hidden; border: 1px solid #e5e7eb; }
.grupo-trigger { width: 100%; background: none; border: none; padding: 12px 16px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background .15s; }
.grupo-trigger:hover { background: rgba(0,0,0,.04); }
.grupo-num { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: var(--gold); font-family: 'Playfair Display', serif; font-size: .9rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.grupo-q { font-size: .84rem; font-weight: 600; color: var(--navy); flex: 1; line-height: 1.35; }
.grupo-arrow { font-size: .72rem; color: var(--gold); transition: transform .25s; flex-shrink: 0; }
.grupo-item.open .grupo-arrow { transform: rotate(180deg); }
.grupo-body { display: none; padding: 0 16px 14px 58px; }
.grupo-item.open .grupo-body { display: block; }
.grupo-conclusion { font-size: .82rem; line-height: 1.65; color: var(--text); border-left: 3px solid var(--gold); padding-left: 12px; }

/* ── CLOSING ── */
.closing-wrap {
  display: flex; flex-direction: column; height: 100%;
}
.closing-hero {
  background: linear-gradient(140deg, var(--navy) 0%, var(--navy-mid) 50%, var(--navy-lt) 100%);
  flex: 0 0 45%;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; text-align: center; padding: 28px 60px;
  position: relative; overflow: hidden;
}
.closing-hero::before { content: 'AA'; position: absolute; font-family: 'Playfair Display', serif; font-size: 18rem; color: rgba(255,255,255,.03); right: -30px; top: -50px; line-height: 1; pointer-events: none; }
.closing-body { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 28px; text-align: center; }
.aa-circle { width: 80px; height: 80px; border-radius: 50%; background: var(--navy); border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--gold); }
.closing-lema { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.3rem; color: var(--navy); line-height: 1.45; max-width: 540px; }

/* ── KEYBOARD HINT ── */
#kb-hint {
  position: fixed;
  bottom: 10px; right: 16px;
  font-size: .65rem; color: rgba(255,255,255,.25);
  letter-spacing: 1px;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div id="topbar-left">
    <div id="timer-display">20:00</div>
    <div style="display:flex;gap:6px">
      <button class="tbtn" id="btnStart">▶ Iniciar</button>
      <button class="tbtn" id="btnPause">⏸ Pausa</button>
      <button class="tbtn" id="btnReset">↺ Reset</button>
    </div>
  </div>
  <div id="topbar-center">
    <div id="slide-title-bar">62ª Reunión Anual de la Conferencia · AA Colombia 2026</div>
  </div>
  <div id="topbar-right">
    <div id="slide-counter">1 / 13</div>
    <button class="nav-btn" id="btnPrev" disabled>← Anterior</button>
    <button class="nav-btn primary" id="btnNext">Siguiente →</button>
  </div>
</div>
<div id="progress-bar" style="width:100%"></div>

<!-- LAYOUT -->
<div id="layout">

  <!-- SIDEBAR -->
  <nav id="sidebar"></nav>

  <!-- STAGE -->
  <div id="stage">
    <div id="slide-frame"><!-- slides rendered here by JS --></div>
  </div>

</div>

<div id="kb-hint">← → Flechas del teclado para navegar</div>

<!-- SLIDE TEMPLATES (hidden) -->
<template id="t-slides">

<!-- ① PORTADA -->
<div class="slide-data" data-label="Portada">
  <div class="cover-wrap">
    <div class="cover-hero">
      <div class="cover-badge">CORPORACIÓN NACIONAL DE ALCOHÓLICOS ANÓNIMOS · COLOMBIA</div>
      <h1>62ª Reunión Anual de la Conferencia</h1>
      <p class="cover-lema">"La Recuperación y la Práctica de las Tradiciones garantizan un mejor Servicio"</p>
    </div>
    <div class="cover-meta">
      <div class="meta-item"><div class="meta-val">30 abr – 3 may</div><div class="meta-lbl">Fechas 2026</div></div>
      <div class="meta-item"><div class="meta-val">Rionegro</div><div class="meta-lbl">Casa De La Salle</div></div>
      <div class="meta-item"><div class="meta-val">60</div><div class="meta-lbl">Conferencistas</div></div>
      <div class="meta-item"><div class="meta-val">43</div><div class="meta-lbl">Delegados asistentes</div></div>
    </div>
  </div>
</div>

<!-- ② ESTRUCTURA -->
<div class="slide-data" data-label="Tres tipos de sesiones">
  <div class="s-header">
    <div class="s-tag">Desarrollo de la 62ª RAC</div>
    <div class="s-title">Tres Tipos de Sesiones</div>
  </div>
  <div class="s-body cols">
    <div class="col w40">
      <div class="card-grid g3" style="grid-template-columns:1fr">
        <div class="card"><div class="card-lbl">Sesión 1</div><div class="card-val">Informativa</div><div class="card-desc">Informes de carpeta, OSG, Entidades Operativas, REDELA e internacional</div></div>

<!-- ⑨ GRUPOS COMPARTIMIENTO -->
<div class="slide-data" data-label="Grupos — Conclusiones">
  <div class="s-header">
    <div class="s-tag">Sesiones de Compartimiento</div>
    <div class="s-title">Cinco Grupos de Reflexión — Conclusiones</div>
    <div class="s-sub">Haga clic en cada grupo para ver la conclusión</div>
  </div>
  <div class="s-body" style="gap:8px">
    <div class="grupo-item" id="g1"><button class="grupo-trigger" onclick="toggleGrupo('g1')"><div class="grupo-num">1</div><div class="grupo-q">El papel de la Asamblea del Área en la Estructura de AA — ¿Cómo está funcionando?</div><div class="grupo-arrow">▼</div></button><div class="grupo-body"><div class="grupo-conclusion">La Asamblea del Área es el corazón de la estructura: decide, corrige y da mandato al delegado. Donde hay asambleas activas y frecuentes, la voz de los grupos llega con fuerza a la Conferencia; donde son débiles o esporádicas, la representatividad se resiente. Se llamó a fortalecer la periodicidad y la participación de los RSG.</div></div></div>
    <div class="grupo-item" id="g2"><button class="grupo-trigger" onclick="toggleGrupo('g2')"><div class="grupo-num">2</div><div class="grupo-q">¿El líder en AA se forma desde el Grupo Base o nace siendo líder?</div><div class="grupo-arrow">▼</div></button><div class="grupo-body"><div class="grupo-conclusion">El verdadero servidor de AA se forma, no nace: el grupo base moldea al servidor a través del ejemplo, la sponsorización y el ejercicio gradual de responsabilidades. El carisma personal puede abrir puertas, pero sin raíces en la recuperación y las Tradiciones no sostiene un servicio sano.</div></div></div>
    <div class="grupo-item" id="g3"><button class="grupo-trigger" onclick="toggleGrupo('g3')"><div class="grupo-num">3</div><div class="grupo-q">La unidad y la confianza son fundamentales — ¿Cómo mantener la Unidad desde la divergencia?</div><div class="grupo-arrow">▼</div></button><div class="grupo-body"><div class="grupo-conclusion">La diversidad de opiniones es riqueza, no amenaza. Las Tradiciones Segunda y Cuarta son el ancla que permite disentir sin dividirse. Escuchar con respeto, votar con honestidad y acatar la consciencia de grupo son las herramientas concretas para mantener la unidad cuando hay divergencia genuina.</div></div></div>
    <div class="grupo-item" id="g4"><button class="grupo-trigger" onclick="toggleGrupo('g4')"><div class="grupo-num">4</div><div class="grupo-q">¿Por qué los Planes de Automantenimiento deben ser conocidos por todos los miembros?</div><div class="grupo-arrow">▼</div></button><div class="grupo-body"><div class="grupo-conclusion">La Séptima Tradición no es solo una colecta: es una declaración de independencia. Cuando los miembros entienden el plan de automantenimiento, contribuyen con conciencia y defienden la autonomía de AA frente a influencias externas. Un grupo que desconoce su financiación tiende a desresponsabilizarse económicamente.</div></div></div>
    <div class="grupo-item" id="g5"><button class="grupo-trigger" onclick="toggleGrupo('g5')"><div class="grupo-num">5</div><div class="grupo-q">¿Cómo evitar vincular la Comunidad con otras causas?</div><div class="grupo-arrow">▼</div></button><div class="grupo-body"><div class="grupo-conclusion">La Décima Tradición es la guía: AA no tiene opinión sobre asuntos ajenos. Tres riesgos frecuentes: usar espacios de AA para causas sociales, permitir que líderes usen su posición para visibilidad política, y aceptar financiación externa condicionada. La defensa es la educación continua en las Tradiciones desde el grupo base.</div></div></div>
  </div>
</div>

<script>
const MINS = 20;
const slideTitles = [
  'Portada', 'Tres tipos de sesiones', 'Quórum', 'Reunión sólo delegados',
  'Custodios elegidos', 'Custodias Clase A',
  'Plan Unicidad — Diagnóstico', 'Plan Unicidad — Implementación',
  'Grupos — Conclusiones', 'Acciones aprobadas',
  'No aprobados / Mociones', 'Clausura', 'Cierre del informe'
];

// Parse slides from template
const tpl = document.getElementById('t-slides').content;
const slideNodes = Array.from(tpl.querySelectorAll('.slide-data'));
const TOTAL = slideNodes.length;

let current = 1, timeLeft = MINS * 60, timerInterval = null, running = false;

// Build sidebar
const sidebar = document.getElementById('sidebar');
slideNodes.forEach((_, i) => {
  const btn = document.createElement('button');
  btn.className = 'side-item' + (i === 0 ? ' active' : '');
  btn.innerHTML = `<span class="side-num">${i + 1}</span><span class="side-label">${slideTitles[i]}</span>`;
  btn.onclick = () => goTo(i + 1);
  sidebar.appendChild(btn);
});

// Render frame
const frame = document.getElementById('slide-frame');
function renderSlide(n) {
  const node = slideNodes[n - 1].cloneNode(true);
  frame.innerHTML = '';
  // Unwrap .slide-data
  while (node.firstChild) frame.appendChild(node.firstChild);
  frame.style.animation = 'none';
  frame.offsetHeight; // reflow
  frame.style.animation = '';
  document.getElementById('slide-title-bar').textContent = slideTitles[n - 1];
}

function goTo(n) {
  // update sidebar
  sidebar.children[current - 1].classList.remove('active');
  current = Math.max(1, Math.min(TOTAL, n));
  sidebar.children[current - 1].classList.add('active');
  // scroll sidebar item into view
  sidebar.children[current - 1].scrollIntoView({ block: 'nearest' });
  // render
  renderSlide(current);
  document.getElementById('slide-counter').textContent = current + ' / ' + TOTAL;
  document.getElementById('btnPrev').disabled = current === 1;
  document.getElementById('btnNext').disabled = current === TOTAL;
}

document.getElementById('btnNext').onclick = () => goTo(current + 1);
document.getElementById('btnPrev').onclick = () => goTo(current - 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(current - 1);
});

// Timer
const display = document.getElementById('timer-display');
const prog    = document.getElementById('progress-bar');
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');

function updateDisplay() {
  display.textContent = fmt(timeLeft);
  prog.style.width = (timeLeft / (MINS * 60) * 100) + '%';
  display.classList.remove('warning','danger');
  if      (timeLeft <= 60)  { display.classList.add('danger');  prog.style.background = '#e63946'; }
  else if (timeLeft <= 300) { display.classList.add('warning'); prog.style.background = '#ff9f43'; }
  else                      {                                   prog.style.background = 'var(--gold)'; }
}
function startTimer() {
  if (running) return; running = true;
  timerInterval = setInterval(() => {
    if (timeLeft > 0) { timeLeft--; updateDisplay(); }
    else { clearInterval(timerInterval); running = false; }
  }, 1000);
}
function pauseTimer() { clearInterval(timerInterval); running = false; }
function resetTimer() { pauseTimer(); timeLeft = MINS * 60; updateDisplay(); }

document.getElementById('btnStart').onclick = startTimer;
document.getElementById('btnPause').onclick = pauseTimer;
document.getElementById('btnReset').onclick = resetTimer;

// Init
renderSlide(1);
updateDisplay();
document.getElementById('slide-counter').textContent = '1 / ' + TOTAL;

// Acordeón
function toggleGrupo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.grupo-item.open').forEach(g => g.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}
window.toggleGrupo = toggleGrupo;
</script>
